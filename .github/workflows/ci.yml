# Builds Author and runs its tests on every pull request into main and every push to it. This
# is the gate the ruleset on main requires (its job name is the required status check; rename
# both together). The release workflow (maven.yml) skips tests entirely and only runs at
# tag-push time, so without this workflow nothing ever builds Author in CI.
#
# Author is developed inside a checkout of the umbrella repository (ElicitSoftware/Elicit) at
# Elicit/Author, and some tests reach up into it: RepeatPerItemSampleTest imports the golden
# census sample from ../samples (UC-019 A6), the language tests read the curated translations
# from ../elicit-i18n (the image carries English only; the dev and test profiles read the same
# directory), and SchemaMirrorFreshnessTest compares the schema mirror with ../Survey when that
# sibling is present. The job reproduces that layout: it clones the umbrella -- preferring a
# branch with the same name as this one, so a cross-repo translation change can be tested
# before merge, otherwise V3, the integration branch, where the sample lives -- and checks
# Author out inside it, then runs Maven from there. Survey is not cloned, so the mirror check
# skips here as it is written to; it runs on a developer's machine.
#
# main is the long-lived line and is gated. Until 2026-10-01 a second line, i18n, ran many
# commits ahead of it and was gated too; it has since been merged into main and deleted.

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest
    # Runs only for a release tag. Pull requests and branch pushes still trigger the workflow so
    # that the ruleset's required check reports, but the job is skipped there, and a skipped job
    # satisfies a required check. Actions minutes are spent once per release, not on every change.
    if: github.ref_type == 'tag'
    timeout-minutes: 60
    # Naming any permission drops every one not named. The job only reads: it checks this
    # repository out and clones the umbrella, which is public.
    permissions:
      contents: read

    steps:
      - name: Clone the umbrella (same-named branch or tag, else V3)
        run: |
          UMBRELLA=https://github.com/ElicitSoftware/Elicit.git
          # Author's main pairs with the umbrella's V3, not its main: the umbrella's main is the
          # released line and has neither the sample nor elicit-i18n.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$BRANCH" = main ] || ! git ls-remote --exit-code "$UMBRELLA" "refs/heads/$BRANCH" "refs/tags/$BRANCH" >/dev/null 2>&1; then
            BRANCH=V3
          fi
          git clone --quiet --depth 1 --branch "$BRANCH" "$UMBRELLA" Elicit
          echo "umbrella: $BRANCH $(git -C Elicit log -1 --format='%h %s')"
          test -f Elicit/samples/census-household-survey.elicit
          test -d Elicit/elicit-i18n/author

      - name: Check out Author inside it
        uses: actions/checkout@v7
        with:
          path: Elicit/Author

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'
          cache-dependency-path: Elicit/Author/pom.xml

      - name: Build and run tests
        working-directory: Elicit/Author
        run: mvn -B clean verify
