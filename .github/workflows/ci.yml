# Builds Author and runs whatever tests exist on every pull request and every push to main.
# This is the gate that enforces the build stays green before code merges — the release
# workflow (maven.yml) skips tests entirely and only runs at tag-push time, so without this
# workflow nothing ever builds Author in CI.
#
# NOTE: Author currently has no src/test directory. `mvn clean verify` therefore builds and
# packages but runs no tests, and the jacoco-check gate in pom.xml (LINE >= 0.70) passes
# vacuously because JaCoCo skips when no execution data file is produced. Once tests are
# added that gate becomes live and will start enforcing 70% line coverage.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Fetch the deployment translations from the umbrella repository
        # The language tests read ../elicit-i18n, exactly as the dev and test profiles do in a
        # local umbrella checkout (the application itself ships English only). Prefer the umbrella
        # branch with the same name as this one, so a cross-repo change can be tested before merge.
        run: |
          UMBRELLA=https://github.com/ElicitSoftware/Elicit.git
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          REF=()
          if git ls-remote --exit-code --heads "$UMBRELLA" "$BRANCH" >/dev/null 2>&1; then
            REF=(--branch "$BRANCH")
          fi
          git clone --depth 1 --filter=blob:none --sparse "${REF[@]}" "$UMBRELLA" "$RUNNER_TEMP/elicit"
          git -C "$RUNNER_TEMP/elicit" sparse-checkout set elicit-i18n
          ln -s "$RUNNER_TEMP/elicit/elicit-i18n" ../elicit-i18n
          ls ../elicit-i18n/

      - name: Build and run tests
        run: mvn -B clean verify
