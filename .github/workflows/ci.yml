# Builds Author and runs its tests on every pull request into a long-lived branch and every
# push to one. This is the gate that enforces the build stays green before code merges — the
# release workflow (maven.yml) skips tests entirely and only runs at tag-push time, so without
# this workflow nothing ever builds Author in CI.
#
# Both main and i18n are gated. i18n is a long-lived line that is many commits ahead of main
# and carries the delimited-token work; while it was ungated, PRs merged into it were never
# compiled, let alone tested.

name: CI

on:
  push:
    branches:
      - main
      - i18n
  pull_request:
    branches:
      - main
      - i18n

jobs:
  test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B clean verify
