# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    # Naming any permission drops every one not named. contents: write is what attaching the
    # installation manual to the release needs (UC-051 BR-004); it also covers checking the
    # repository out (#88). Nothing here reports checks or comments on a pull request, and the
    # image push uses the Docker Hub secrets.
    permissions:
      contents: write

    # Both manuals are typeset with the umbrella's brand package (C-028), and the installation
    # manual's reference is checked by the umbrella's check-properties.sh, so the job reproduces
    # the layout Author is developed in: the umbrella at Elicit/, Author inside it, as ci.yml does.
    defaults:
      run:
        working-directory: Elicit/Author

    steps:
      - name: Clone the umbrella (V3, the integration branch)
        working-directory: .
        run: |
          git clone --quiet --depth 1 --branch V3 https://github.com/ElicitSoftware/Elicit.git Elicit
          echo "umbrella: V3 $(git -C Elicit log -1 --format='%h %s')"
          test -f Elicit/docs/manual/elicit-brand.sty
          test -x Elicit/docs/manual/check-properties.sh

      - name: Check out Author inside it
        uses: actions/checkout@v7
        with:
          path: Elicit/Author
          # Nothing after the checkout uses git with the job's credential; the release step at
          # the end passes its own GH_TOKEN.
          persist-credentials: false

      # A version with a pre-release part (3.0.0-beta.1, 3.0.0-rc.1) is pushed under its exact
      # tag only. :<major.minor> and :latest are what general deployment pulls, so they move
      # only for a final version (3.0.0). A manual run has no tag to take a version from, so it
      # is refused rather than pushing an image named after a branch. The tag has to read as a
      # version (v3.0.0, v3.0.0-beta.1) before anything is derived from it, and the later steps
      # take the derived values from their environment rather than from the script text.
      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Release images are built from a tag (v3.0.0, v3.0.0-beta.1); $GITHUB_REF is not one."
            exit 1
          fi
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::A release tag is v<major>.<minor>.<patch>, optionally with a pre-release part (v3.0.0, v3.0.0-beta.1)."
            exit 1
          fi
          VERSION=${TAG#v}
          VERSION=${VERSION#V}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release $VERSION: pushing :$VERSION only"
            echo "extra_tags=" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tags=$(echo "$VERSION" | cut -d. -f1,2),latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'
          cache-dependency-path: Elicit/Author/pom.xml

      # The image is tagged from the git tag, the jar from the pom; a tag on a pom that says
      # something else would publish an image whose own version disagrees with its name.
      - name: Tag matches the pom version
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the pom version $POM_VERSION."
            exit 1
          fi

      # The manual ships inside the image (UC-039 BR-004), stamped with this version and the
      # build date (BR-003, NFR-016). src/main/resources/manual/ is not tracked, so this checkout
      # has no PDF until it is typeset here, which happens for every tagged build, pre-release
      # or final; a failed typeset fails the release rather than publishing an image whose
      # Manual link is missing (UC-039 A1).
      - name: Typeset the manual
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docs/manual/build-manual.sh "$VERSION" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          test -s src/main/resources/manual/elicit-author-manual.pdf

      # The installation manual is published beside the image, never packaged into it (C-027,
      # UC-051 BR-004). Its configuration reference is checked against the code first, and a
      # drifted reference or a failed typeset fails the release (UC-051 A6).
      - name: Typeset the installation manual
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANUAL=installation docs/manual/build-manual.sh "$VERSION" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          test -s docs/manual/elicit-author-installation-manual.pdf

        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -Dquarkus.profile=docker is what buildDockerImage.sh builds with: the vaadin-dev-tools
      # profile in pom.xml is active only when quarkus.profile is absent, so naming it keeps
      # Vaadin's development tooling out of the image (C-007). The %docker profile sets
      # quarkus.container-image.push=false for local builds; the push=true below is a system
      # property and outranks it.
      - name: Build and Push Multi-Platform Image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTRA_TAGS: ${{ steps.version.outputs.extra_tags }}
        run: |
          mvn -B clean package \
            -Dquarkus.profile=docker \
            -Dquarkus.docker.buildx.platform=linux/amd64,linux/arm64 \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag="$VERSION" \
            ${EXTRA_TAGS:+"-Dquarkus.container-image.additional-tags=$EXTRA_TAGS"} \
            -Dmaven.test.skip=true

      # Check what was packaged rather than trust the flag, as buildDockerImage.sh does (C-007).
      # The image is already pushed when this runs, so a failure here marks the release as one
      # to withdraw: the job stops before the release is created.
      - name: No Vaadin development tooling was packaged
        run: |
          if ls target/quarkus-app/lib/main | grep -i '^com\.vaadin\.vaadin-dev'; then
            echo "::error::vaadin-dev is among the packaged libraries; the image was built without -Dquarkus.profile=docker."
            exit 1
          fi

      # Attach the installation manual to the release of this tag, creating the release when the
      # tag has none yet; a pre-release version makes a pre-release (UC-051 step 7).
      - name: Attach the installation manual to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PDF=docs/manual/elicit-author-installation-manual.pdf
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PDF" --repo "$GITHUB_REPOSITORY" --clobber
          else
            PRE=; [[ "$VERSION" == *-* ]] && PRE=--prerelease
            gh release create "$TAG" "$PDF" --repo "$GITHUB_REPOSITORY" $PRE --title "Elicit Author $VERSION" --notes "Image: elicitsoftware/author:$VERSION. The installation manual is attached."
          fi
