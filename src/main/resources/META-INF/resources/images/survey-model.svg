<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>A survey drawn as the designer draws it: two step lanes, section cards, question rows, and two rule arrows</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>
  <!-- Survey frame -->
  <rect x="8" y="8" width="704" height="284" rx="10" fill="#f7f8fa" stroke="#c9ced6"/>
  <text x="20" y="30" font-weight="600" fill="#1f2933">Survey: Family history</text>

  <!-- Step 1 lane -->
  <rect x="20" y="42" width="320" height="238" rx="8" fill="#ffffff" stroke="#c9ced6"/>
  <rect x="30" y="52" width="26" height="26" rx="6" fill="#1a5fb4"/>
  <text x="43" y="70" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <text x="64" y="70" font-weight="600" fill="#1f2933">Step: About you</text>

  <!-- Section: You -->
  <rect x="30" y="90" width="300" height="80" rx="6" fill="#e8f0fb" stroke="#9db8e0"/>
  <text x="42" y="110" font-weight="600" fill="#1a5fb4">▭ Section: You</text>
  <rect x="42" y="118" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="50" y="132" fill="#1f2933"># How old are you?</text>
  <rect x="42" y="142" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="50" y="156" fill="#1f2933">◉ Do you have children?</text>
  <circle cx="318" cy="152" r="4" fill="#b7791f"/>

  <!-- Section: Children (target of SHOW) -->
  <rect x="30" y="182" width="300" height="86" rx="6" fill="#e8f0fb" stroke="#9db8e0"/>
  <text x="42" y="202" font-weight="600" fill="#1a5fb4">▭ Section: Children</text>
  <rect x="42" y="210" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="50" y="224" fill="#1f2933"># How many children?</text>
  <circle cx="318" cy="220" r="4" fill="#b7791f"/>
  <rect x="42" y="236" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="50" y="250" fill="#1f2933">◉ Any adopted?</text>

  <!-- Step 2 lane -->
  <rect x="380" y="42" width="320" height="238" rx="8" fill="#ffffff" stroke="#c9ced6"/>
  <rect x="390" y="52" width="26" height="26" rx="6" fill="#1a5fb4"/>
  <text x="403" y="70" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <text x="424" y="70" font-weight="600" fill="#1f2933">Step: Each child</text>

  <!-- Section: Child (target of REPEAT) -->
  <rect x="390" y="90" width="300" height="104" rx="6" fill="#e8f0fb" stroke="#9db8e0"/>
  <text x="402" y="110" font-weight="600" fill="#1a5fb4">▭ Section: Child</text>
  <rect x="402" y="118" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="410" y="132" fill="#1f2933">T Child's name</text>
  <rect x="402" y="142" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="410" y="156" fill="#1f2933">▤ Date of birth</text>
  <rect x="402" y="166" width="276" height="20" rx="4" fill="#ffffff" stroke="#d5dae2"/>
  <text x="410" y="180" fill="#1f2933">◉ Any health conditions?</text>

  <!-- SHOW rule: children? = Yes -> Section: Children -->
  <path d="M318,152 C350,152 350,196 340,196 L332,196" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#head)"/>
  <circle cx="352" cy="174" r="11" fill="#b7791f"/>
  <text x="352" y="178" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">👁</text>
  <text x="352" y="200" text-anchor="middle" fill="#7a5410" font-size="11">= Yes · SHOW</text>

  <!-- REPEAT rule: how many children -> Section: Child, N times -->
  <path d="M318,220 C360,220 360,100 388,100" fill="none" stroke="#b7791f" stroke-width="2" marker-end="url(#head)"/>
  <circle cx="360" cy="140" r="11" fill="#b7791f"/>
  <text x="360" y="144" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">↻</text>
  <text x="360" y="120" text-anchor="middle" fill="#7a5410" font-size="11">> 0 · REPEAT ×N</text>
</svg>
