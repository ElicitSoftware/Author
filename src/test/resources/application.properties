# =============================================================================
# TEST PROFILE - Testcontainers PostgreSQL + mock OIDC
# =============================================================================
# Only on the test classpath. PostgresTestResource starts one throwaway Postgres, runs
# db/testcontainers-init.sql (roles + schemas), and injects the JDBC url/credentials at
# runtime. Flyway (test scope only) then replays the verbatim mirror of Survey's
# db/migration (db/schema-mirror, kept fresh by scripts/sync-survey-schema.sh) followed
# by Author's own fixtures under db/test. Author ships no migrator (C-005).

%test.quarkus.datasource.devservices.enabled=false

%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/schema-mirror,db/test
%test.quarkus.flyway.schemas=survey
%test.quarkus.flyway.baseline-on-migrate=false
%test.quarkus.flyway.placeholders.survey_user=survey_user
%test.quarkus.flyway.placeholders.surveyadmin_user=surveyadmin_user
%test.quarkus.flyway.placeholders.surveyreport_user=surveyreport_user

# Cheapest entity-mapping smoke test: boot fails on a column mismatch.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.statistics=false

# OIDC without Keycloak: keep the extension loaded so @TestSecurity and the role
# augmentor work, skip discovery that would hang on an unreachable server.
%test.quarkus.oidc.enabled=true
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.discovery-enabled=false
%test.quarkus.oidc.auth-server-url=
%test.quarkus.oidc.credentials.secret=test-secret

%test.quarkus.container-image.build=false
%test.quarkus.container-image.push=false
%test.quarkus.otel.enabled=false
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.micrometer.enabled=false
%test.quarkus.smallrye-health.enabled=false
%test.quarkus.log.level=WARN
%test.quarkus.log.console.json=false
%test.quarkus.http.test-port=8092

# jacoco-maven-plugin owns report generation (see pom.xml); silence quarkus-jacoco's own report.
%test.quarkus.jacoco.report=false

# Translations (UC-040): the pseudo-locale zxx renders every key as a marker for the
# displayed-string sweep.
%test.i18n.pseudo-locale.enabled=true
# The language tests read the curated translations from the umbrella checkout (CI fetches them to
# the same place).
%test.i18n.file.system.path=../elicit-i18n
