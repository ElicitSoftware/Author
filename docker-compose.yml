# Author's own stack: the authoring tool and the three things it cannot run without.
#
#   Author            http://localhost:8084  (Keycloak user author/author)
#   Author preview    http://localhost:8085  (Survey against the `author` database)
#   Keycloak          http://localhost:8180  (admin/admin)
#   PostgreSQL        localhost:5452, database `author` (survey/admin)
#
# `docker compose up -d` is enough. For dev mode, start everything but Author itself --
# `docker compose up -d db keycloak author-survey` -- and run the Author run configuration
# (quarkus:dev, port 8084); the %dev profile already points at these ports.
#
# The site applications are not here: Author never calls Survey, Admin, FHHS or Pedigree, and
# sends no mail and no SFTP uploads. The whole platform, which the three end-to-end suites in
# this repo (e2e-tests/, e2e_multisite/, e2e_multisite_multilingual/) are written against, is
# docker-compose-full.yml:
#
#   docker compose -f docker-compose-full.yml up -d
#
# The two files share the compose project name below, the host ports and ./postgresql/PGDATA,
# so they are one stack at two sizes and cannot run at the same time. Neither can run beside
# the umbrella's stack or either multi-site suite, for the same reason.
#
# This repo expects to sit inside an Elicit umbrella checkout (Elicit/Author/). Shared assets are
# not duplicated here: the brand comes from ../elicit-brand and the translations from
# ../elicit-i18n (the images carry English only; every other language is a file in that curated
# set, one sub-directory per app). Both mounts are optional -- without them Author shows the
# brand packaged in the image and English only. What is Author's own lives here -- ./keycloak
# (the realm, which unlike the umbrella's still carries the elicit-author client, its roles and
# the `author` user) and ./db-init (the `author` database).
#
# Image tag (release). Both Elicit application images -- author and the author-survey preview --
# are pulled at the one tag in ELICIT_TAG, so the preview never runs a different release from
# the tool. It defaults to `latest`, which is what the local builds (the umbrella's
# buildDockerImages.sh and ./buildDockerImage.sh here) are tagged with.
# To run a published release, set the tag to its version, either for one command
#
#   ELICIT_TAG=3.0.0-beta.1 docker compose up -d
#
# or once, in a `.env` file beside this one (ignored by git):
#
#   ELICIT_TAG=3.0.0-beta.1
#
# A pre-release (3.0.0-beta.1, 3.0.0-rc.1) is published under its exact version only; `latest`
# and `3.0` move only when a final version ships, so a beta is reachable only by naming it.
# The database image, elicitsoftware/elicit_db, is versioned on its own and is not covered.

name: elicit-author

services:
# The authoring tool works in a database of its own -- `author`, a second database in the
# Postgres container, created by ./db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql when the cluster
# is first initialized:
#   author-survey - a Survey container pointed at db/author. Survey owns the schema
#                   migrations, so this is what creates the survey schema there; it also
#                   serves as the respondent preview of a survey being authored (host port
#                   8085, any access code works)
#   author        - the authoring tool (host port 8084)
# An existing ./postgresql/PGDATA does not get the `author` database automatically:
# run the init script once (see the comment at the top of that file) or reset PGDATA.
  author-survey:
    image: elicitsoftware/survey:${ELICIT_TAG:-latest}
    ports:
      - 8085:8080
    environment:
      TZ: America/Detroit
      # Preview only: an author types any access code to walk through a draft.
      accessCode.autoRegister: true
      # Preview only: the reporting ETL stays off. Every survey would get a reporting schema
      # of its own (Survey UC-008), so nothing collides any more; it is off because nothing
      # reports on preview answers yet. The reporting work turns it on when it needs the
      # preview to model what a site builds. The drop below is what UC-047 calls before
      # deleting a survey, so a schema never outlives its survey once the ETL is on.
      elicit.etl.enabled: "false"
      elicit.etl.drop.enabled: "true"
      brand.file.system.path: /opt/brand
      # The preview connects as survey_user and migrates as elicit_owner, like Survey; the
      # roles are cluster-wide, so the author database takes the same passwords.
      ELICIT_DB_PASSWORD: SURVEYPW
      ELICIT_OWNER_DB_PASSWORD: SURVEYPW
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      # Both of Survey's datasources move from the `survey` database to `author`.
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      quarkus.datasource.owner.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      # No collector runs in this stack (Jaeger is in docker-compose-full.yml), so the
      # OpenTelemetry SDK is switched off rather than left to log failed exports.
      quarkus.application.name: author-survey
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    volumes:
      - ../elicit-brand/:/opt/brand:ro
      - ../elicit-i18n/:/opt/i18n:ro
      # - ../../Elicit_Campsites/um-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
  author:
    image: elicitsoftware/author:${ELICIT_TAG:-latest}
    ports:
      - 8084:8080
    healthcheck:
        test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/q/health/ready"]
        interval: 15s
        timeout: 5s
        retries: 20
        start_period: 60s
    environment:
      TZ: America/Detroit
      brand.file.system.path: /opt/brand
      # The image carries English only; the other languages are read from <this path>/<app>/.
      # Narrow what is offered with i18n.offered.locales (e.g. en,es-419).
      i18n.file.system.path: /opt/i18n
      # The preview Survey, which drops a survey's reporting schema before Author deletes it (UC-047).
      author.preview.survey.url: http://author-survey:8080
      # Author connects as survey_user (Survey's grants cover every definition table)
      # to the `author` database; the schema there is created by author-survey.
      quarkus.datasource.jdbc.url: jdbc:postgresql://db:5432/author?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
      ELICIT_DB_PASSWORD: SURVEYPW
      OIDC_CLIENT_SECRET: secret
      # The OIDC URL is left at the image default, http://host.docker.internal:8180/realms/elicit/.
      # It has to work from both places the browser and the container reach Keycloak: the
      # container resolves host.docker.internal to the Docker host, where Keycloak is published
      # on 8180, and Docker Desktop maps the same name to 127.0.0.1 on the host. Pointing it at
      # http://keycloak:8080 instead breaks the login redirect - the browser cannot reach the
      # compose-internal name.
      # No collector runs in this stack (Jaeger is in docker-compose-full.yml), so the
      # OpenTelemetry SDK is switched off rather than left to log failed exports.
      quarkus.application.name: author
      quarkus.otel.sdk.disabled: "true"
    volumes:
      - ../elicit-brand/:/opt/brand:ro
      - ../elicit-i18n/:/opt/i18n:ro
      # - ../../Elicit_Campsites/um-brand/:/opt/brand:ro
    depends_on:
      db:
        condition: service_healthy
      author-survey:
        condition: service_healthy
## Postgres Database
  db:
    # Not on ELICIT_TAG: the database image has its own release cadence (see the header).
    image: elicitsoftware/elicit_db:latest
    # Setup the directories to persist data between starts.
    # if you need to reset your database you can delete the PGDATA directory and restart the containers
    # this will cause the database to be recreated.
    volumes:
      - ./postgresql/PGDATA:/var/lib/postgresql/data
      # Adds the `author` database on first initialization.
      - ./db-init/V0.0.4__CREATE_AUTHOR_DATABASE.sql:/docker-entrypoint-initdb.d/V0.0.4__CREATE_AUTHOR_DATABASE.sql:ro
    ports:
      - 5452:5432
    environment:
      TZ: "America/Detroit"
      POSTGRES_USER: "survey"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      # The image's own `survey` database is still there, unused; the probe keeps using it.
      test: ["CMD-SHELL", "pg_isready -U survey && psql -U survey -d survey -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
# OIDC Server
# Keycloak, with the realm that carries the elicit-author client and the `author` user.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    command: start-dev --import-realm --verbose -Dkeycloak.features=scripts
    ports:
      - "8180:8080"
    environment:
      TZ: "America/Detroit"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/db:/h2
